[project]
name = "aa-gate"
version = "0.1.0"
description = "A checked assistant for adverse-action reasons"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anton P. Stahl" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "interpret-core",
    "numpy",
    "openai>=3.46.0",
    "pandas",
    "scikit-learn",
    "scipy",
    "xgboost",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
